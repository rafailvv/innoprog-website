name: tests

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Publish coverage summary
        run: |
          test -s coverage/coverage-summary.json
          test -s coverage/coverage-metadata.json
          node -e 'const c=require("./coverage/coverage-summary.json").total; console.log(`### Coverage\n\n| Metric | Percent |\n|---|---:|\n| Statements | ${c.statements.pct}% |\n| Lines | ${c.lines.pct}% |\n| Functions | ${c.functions.pct}% |\n| Branches | ${c.branches.pct}% |`)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-test-artifacts
          path: |
            test-results
            coverage
