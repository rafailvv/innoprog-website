# Installed inside the HTTPS server block for innoprog.ru.
# The active upstream include is replaced atomically by deploy-blue-green.sh.

location ^~ /_next/static/ {
    alias /opt/innoprog/data/website-static/;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ ^/(privacy|consent|advertising-consent|oferta|license|software-operation-manual|functional-characteristics)$ {
    include /etc/nginx/innoprog-upstreams/website-http.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_flags __vdpl secure samesite=lax;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, noarchive" always;
}

location / {
    # Website does not expose Server Actions. Reject forged action headers at
    # the edge so scanners do not reach Next.js or pollute application logs.
    if ($http_next_action != "") {
        return 404;
    }

    include /etc/nginx/innoprog-upstreams/website-http.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_flags __vdpl secure samesite=lax;
}
