# Installed inside the HTTPS server block for innoprog.ru.
# The active upstream include is replaced atomically by deploy-blue-green.sh.

location ^~ /_next/static/ {
    alias /opt/innoprog/data/website-static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Resolve Object Storage at request time using IPv4 only. The edge host has no
# IPv6 route, so accepting AAAA records can otherwise produce intermittent 502s.
location ^~ /files/ {
    resolver 127.0.0.53 valid=300s ipv6=off;
    set $website_storage_host storage.yandexcloud.net;
    rewrite ^/files/(.*)$ /innoprog-documents/site-public/$1 break;
    proxy_pass https://$website_storage_host;
    proxy_set_header Host $website_storage_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $website_storage_host;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, noarchive" always;
}

location ~ ^/(privacy|consent|advertising-consent|oferta|license|software-operation-manual|functional-characteristics)$ {
    include /etc/nginx/innoprog-upstreams/website-http.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_flags __vdpl secure samesite=lax;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, noarchive" always;
}

location / {
    # Website does not expose Server Actions. Reject forged action headers at
    # the edge so scanners do not reach Next.js or pollute application logs.
    if ($http_next_action != "") {
        return 404;
    }

    include /etc/nginx/innoprog-upstreams/website-http.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_flags __vdpl secure samesite=lax;
}
