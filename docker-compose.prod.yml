services:
  website:
    image: innoprog-website:${IMAGE_TAG:-local}
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0755
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${IMAGE_REVISION:-local}
      args:
        NEXT_DEPLOYMENT_ID: ${IMAGE_REVISION:-local}
    container_name: ${CONTAINER_NAME:-innoprog-website}
    labels:
      org.opencontainers.image.revision: ${IMAGE_REVISION:-local}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-8082}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
